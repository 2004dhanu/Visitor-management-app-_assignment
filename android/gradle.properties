# Heap sizes are deliberately modest. The build runs three JVMs (the Gradle
# daemon, the Kotlin compile daemon and Dart/AOT), so an over-large Gradle heap
# starves the others: -Xmx8G on this 16GB machine failed twice, first with
# "Not enough memory to run compilation" from the Kotlin daemon and then with a
# native allocation failure in the Gradle daemon itself.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# The Kotlin compiler daemon is a separate JVM and needs its heap set here;
# its default is too small for a release build.
kotlin.daemon.jvmargs=-Xmx1G

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
